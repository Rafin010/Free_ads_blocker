<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Blocker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo-wrap">
          <img src="../assets/icons/icon128.png" alt="Free Blocker" class="logo-img"
            onerror="this.src='https://via.placeholder.com/40'">
          <span id="global-status-indicator" class="status-dot active"></span>
        </div>
        <div class="logo-text">
          <h1 class="app-name">Free Blocker</h1>
          <p id="global-status-text" class="status-label active">
            <span class="pulse-dot"></span>
            Protection Active
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-dashboard" class="icon-btn" title="Dashboard">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
            </path>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
            </path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Professional Stats Box -->
    <div class="stats-premium-box">
      <div class="stat-box">
        <div class="stat-icon bg-indigo-light">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div class="stat-info">
          <span class="stat-lbl">Blocked Today</span>
          <span id="stat-blocked-today" class="stat-num">0</span>
        </div>
      </div>
      
      <div class="stat-divider-vertical"></div>

      <div class="stat-box">
        <div class="stat-icon bg-purple-light">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div class="stat-info">
          <span class="stat-lbl">Total Blocked</span>
          <span id="stat-blocked-total" class="stat-num">0</span>
        </div>
      </div>
    </div>

    <div id="features-container" class="features-grid-wrapper">

      <div class="loader-wrap">
        <div class="spinner"></div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <button id="btn-earnings" class="premium-btn">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" class="premium-icon">
        <path fill-rule="evenodd"
          d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
          clip-rule="evenodd" />
      </svg>
      Premium & Referrals
    </button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>

</html>
